// 尋寶單題目：編輯中的草稿，按「儲存題目」才送出
const HQE = () => ss.huntDraft || HQ();
function huntRead(){ return HQE().map((q,i)=>({zone:document.getElementById('hz'+i).value.trim(), q:document.getElementById('hqq'+i).value.trim(), a:document.getElementById('ha'+i).value.trim(), photo:document.getElementById('hp'+i).checked})); }
async function huntSave(){ const r = await adminOp('hunt', {hunt:huntRead().filter(x=>x.q)}, '尋寶單題目已更新'); if(r.ok){ ss.huntDraft=null; render(); } }
function huntAdd(){ ss.huntDraft = [...huntRead(), {zone:'', q:'新題目', a:''}]; render(); }
function huntDel(i){ if(!confirm(`刪除第 ${i+1} 題？`)) return; const l=huntRead(); l.splice(i,1); ss.huntDraft=l; render(); }
function saveTable(){ adminOp('guessTable', {table:[0,1,2,3,4,5].map(w=>Math.max(0,parseInt(document.getElementById('gt'+w).value)||0))}, '次數表已更新'); }
function adjAll(d){
  if(!confirm(`確定讓全部 20 個戲班的可猜次數 ${d>0?'+':'−'}1？`)) return;
  adminOp('extraAll', {d}, `全部戲班次數 ${d>0?'+':'−'}1`);
}
function adjExtra(c,d){ ss.adCls=String(c); adminOp('extra', {target:c, d}); }
function reopenBox(c){ ss.adCls=String(c); adminOp('reopen', {target:c}, `第 ${c} 戲班恢復解箱（計時接續）`); }
function resetBox(c){ ss.adCls=String(c); if(!confirm(`確定刪除第 ${c} 戲班的寶箱紀錄？`)) return; adminOp('resetBox', {target:c}); }
function download(name, text, type){ const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([text],{type})); a.download=name; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),1000); }
function exportCSV(){
  const head=['梯次','戲班','人數','寶箱密碼',...ELEMS,'勝場','可猜次數','已猜次數','寶箱狀態','開始時間','開箱時間','解箱用時(秒)','猜測紀錄'];
  const rows=Array.from({length:20},(_,i)=>i+1).map(c=>{const b=S.box[c], d=duration(c), st=boxStatus(c);
    return [halfOf(c)===1?'第一梯':'第二梯',c,classSize(c),pwOf(c),...ELEMS.map(e=>{const r=res(e,c);return r?(r.win?'勝':'敗'):'';}),
      wins(c),allowed(c),usedGuess(c),STATUS_TXT[st],clock(b?.start),clock(b?.end),d??'',
      (b?.guesses||[]).map(g=>`${g.g}=${g.a}A${g.b}B`).join(' ')];});
  const csv='\ufeff'+[head,...rows].map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')).join('\r\n');
  download('黃府大戲_成績.csv', csv, 'text/csv;charset=utf-8');
}
function exportJSON(){ download(`黃府大戲_備份_${new Date().toISOString().slice(0,16).replace(/[:T]/g,'')}.json`, JSON.stringify(S,null,1), 'application/json'); }
function importJSON(inp){
  const f=inp.files[0]; if(!f) return;
  const r=new FileReader(); r.onload=()=>{ try{ const o=JSON.parse(r.result); if(!o.settings||!o.results) throw 0;
    if(!confirm('匯入會覆蓋目前所有資料，確定？')) return; adminOp('import', {data:o}, '匯入完成'); }
    catch(e){ toast('檔案格式不正確'); } };
  r.readAsText(f);
}
function resetAll(){
  if(!confirm('確定清空所有關卡登記與寶箱紀錄？（設定會保留）')) return;
  if(prompt('請輸入「清空」確認')!=='清空') return;
  adminOp('resetAll', {}, '已清空');
}

/* ===== 所有輸入框都不讓瀏覽器記錄、跳出之前輸入過的內容 ===== */
function noMemo(root){ (root.querySelectorAll ? root.querySelectorAll('input,textarea') : []).forEach(i=>{ if(i.type==='checkbox'||i.type==='file'||i.dataset.nm) return; i.dataset.nm=1; i.setAttribute('autocomplete', i.type==='password'?'new-password':'off'); i.setAttribute('autocorrect','off'); i.setAttribute('spellcheck','false'); if(!i.name) i.name='f'+Math.random().toString(36).slice(2,8); }); }
noMemo(document);
new MutationObserver(ms=>ms.forEach(m=>m.addedNodes.forEach(n=>n.nodeType===1 && noMemo(n)))).observe(document.body,{childList:true,subtree:true});
/* ===== 計時更新 ===== */
setInterval(updateCountdown, 1000);
setInterval(()=>{ if(tab==='map' && typeof MY==='number' && !document.getElementById('picker')) render(); }, 60000);
setInterval(()=>{ document.querySelectorAll('[data-timer]').forEach(el=>{ const c=+el.dataset.timer; if(boxStatus(c)==='playing') el.textContent=mmss(duration(c)); }); },1000);
setInterval(()=>{ if(document.visibilityState==='visible') refresh(); }, REMOTE ? 8000 : 3000);
document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='visible'){ idleCheck(); refresh(); } else markAlive(); });
window.addEventListener('pagehide', markAlive);
setInterval(()=>{ if(document.visibilityState==='visible') markAlive(); }, 60000);
idleCheck();
if(typeof MY==='number' && !CODE) MY=null;           // 戲班要用登入密碼重新登入
if(MY==='staff' && !PIN){ MY=null; ss.staffOK=false; setRole(null); }   // 沒有工作人員密碼 → 回到登入畫面
if(MY==='staff') tab='staff';                         // 重新整理後留在後台
// 先用上次的資料把畫面畫出來（同一個戲班才用），不用等後台
if(REMOTE && MY!==null) try{ const snap=JSON.parse(localStorage.getItem(SNAPKEY)||'null'); if(snap && snap.state && (snap.code||'')===(CODE||'')){ const mr=MINE_READY; applyState(snap.state); MINE_READY=mr; } }catch(e){}
render();
if(MY===null) showPicker();
// 工作人員驗證與抓最新資料同時送出
(async()=>{
  const chk = (MY==='staff' && PIN) ? api('login', {pin:PIN}, {silent:true}) : null;
  const st = refresh(true);
  if(chk){ const r=await chk; if(!r.ok){ setPin(''); setRole(null); ss.staffOK=false; } else setRole(r); }
  await st; if(chk) render();
})();
</script>
